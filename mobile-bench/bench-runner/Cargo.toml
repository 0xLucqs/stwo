[package]
name = "bench-runner"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Host and Android benchmark runner for stwo proving workloads"

[features]
default = ["parallel"]
parallel = ["dep:rayon", "stwo/parallel", "stwo-examples/parallel"]
jni = ["dep:jni"]

[lib]
crate-type = ["lib", "cdylib"]

[dependencies]
jni = { version = "0.21.1", optional = true }
num-traits.workspace = true
rand.workspace = true
rayon = { workspace = true, optional = true }
serde_json = "1.0.148"
sha2 = { version = "0.10.9", features = ["asm"] }
stwo = { path = "../../crates/stwo", version = "2.2.0", features = ["prover"] }
stwo-examples = { path = "../../crates/examples", version = "2.2.0" }
